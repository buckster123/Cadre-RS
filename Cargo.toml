[workspace]
resolver = "2"
members = [
    "crates/cadre",
    "crates/cadre-kernel",
    "crates/cadre-lang",
    "crates/cadre-model",
    "crates/cadre-inspect",
    "crates/cadre-occt",
]
# Default CI / `cargo test` skips OCCT (long C++ build, LGPL link).
default-members = [
    "crates/cadre",
    "crates/cadre-kernel",
    "crates/cadre-lang",
    "crates/cadre-model",
    "crates/cadre-inspect",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/buckster123/Cadre-RS"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
starlark = "0.14.2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# workspace crates
cadre-kernel = { path = "crates/cadre-kernel" }
cadre-lang = { path = "crates/cadre-lang" }
cadre-model = { path = "crates/cadre-model" }
cadre-inspect = { path = "crates/cadre-inspect" }
cadre-occt = { path = "crates/cadre-occt" }
