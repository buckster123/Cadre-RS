[workspace]
resolver = "2"
members = [
    "crates/cadre",
    "crates/cadre-kernel",
    "crates/cadre-lang",
    "crates/cadre-model",
    "crates/cadre-inspect",
    "crates/cadre-cli",
    "crates/cadre-bench",
    "crates/cadre-render",
    "crates/cadre-mcp",
    "crates/cadre-parts",
    "crates/cadre-api",
    "crates/cadre-robot",
    "crates/cadre-fab",
    "crates/cadre-harness",
    "crates/cadre-occt",
]
default-members = [
    "crates/cadre",
    "crates/cadre-kernel",
    "crates/cadre-lang",
    "crates/cadre-model",
    "crates/cadre-inspect",
    "crates/cadre-cli",
    "crates/cadre-bench",
    "crates/cadre-render",
    "crates/cadre-mcp",
    "crates/cadre-parts",
    "crates/cadre-api",
    "crates/cadre-robot",
    "crates/cadre-fab",
    "crates/cadre-harness",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/buckster123/Cadre-RS"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
starlark = "0.14.2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

cadre-kernel = { path = "crates/cadre-kernel" }
cadre-lang = { path = "crates/cadre-lang" }
cadre-model = { path = "crates/cadre-model" }
cadre-inspect = { path = "crates/cadre-inspect" }
cadre-cli = { path = "crates/cadre-cli" }
cadre-bench = { path = "crates/cadre-bench" }
cadre-render = { path = "crates/cadre-render" }
cadre-mcp = { path = "crates/cadre-mcp" }
cadre-parts = { path = "crates/cadre-parts" }
cadre-api = { path = "crates/cadre-api" }
cadre-robot = { path = "crates/cadre-robot" }
cadre-fab = { path = "crates/cadre-fab" }
cadre-harness = { path = "crates/cadre-harness" }
cadre-occt = { path = "crates/cadre-occt" }

# H3: patched opencascade so cadre-occt can BRep-transform without STEP I/O.
[patch.crates-io]
opencascade = { path = "third_party/opencascade" }
