[package]
name = "cadre-bench"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Parity suite runner for Cadre-RS (parts 1–N deterministic checks)"

[features]
default = []
occt = ["dep:cadre-occt"]

[dependencies]
cadre-inspect = { workspace = true }
cadre-kernel = { workspace = true }
cadre-lang = { workspace = true }
cadre-occt = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
