[package]
name = "cadre-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Cadre CLI — build / inspect / export"
default-run = "cadre"

[[bin]]
name = "cadre"
path = "src/main.rs"

[features]
default = []
# Real STEP/tessellation via Open CASCADE (LGPL). Requires CMake policy on CMake ≥ 4.
occt = ["dep:cadre-occt"]

[dependencies]
anyhow = { workspace = true }
cadre-inspect = { workspace = true }
cadre-kernel = { workspace = true }
cadre-lang = { workspace = true }
cadre-model = { workspace = true }
cadre-bench = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

cadre-occt = { workspace = true, optional = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
